apiVersion: apps/v1
kind: Deployment

# {{ "<----------------------------- if else condition ------------------------------>" }}
  

personalinfo:
{{- if .Values.Customblock.introEnable }}
  firstname: {{.Values.Customblock.author.firstname | default "John" | upper | title | quote | nindent 18}}
  lastname: {{.Values.Customblock.author.lastname | default "Doe" | upper | title | quote | nindent 18}}
  address: {{.Values.Customblock.author.address | default "Earth" | upper | quote | nindent 18}}
  email: {{.Values.Customblock.author.email | default "abc@yahoo.com" | quote | nindent 18}}
{{- else }}
  {{"INTRODUCTION DISABLED"}}
{{- end }}



# {{ "<----------------------------- with else condition----------------------------->" }}


withElseOut:
  {{- with .Values.Customblock.author.fname}}
  {{- toYaml . | nindent 1}}
  {{- else}}
  {{"VALUE NOT find"}}
  {{- end}}



# {{ "<----------------------------- with condition----------------------------->" }}


{{- with .Values.Customblock.author.fname}}
withElseIn:
{{- toYaml . | nindent 1}}
{{- end}}


# {{ "<------------------------------ variable ----------------------------->" }}

variableIn:
{{ $myVar := .Values.autoscaling.enabled }}  
variableOut:
{{- if $myVar }}  
  {{"Hi, I am with Varaible True" }}  
{{- else }}  
  {{"Hi, I am with varaible False" }}  
{{- end }}  


# {{ "<------------------------------- Loops ---------------------------->" }}


LoopsIn:
{{- range .Values.Customblock.author.fname }}
LoopsOut:
  {{ . }}
{{- end }}



# {{ "<------------------------------- Loops in dictionary ----------------------->" }}


LoopsIn:
{{- range $key , $value := .Values.image }}
LoopsOut:
  {{ $key :  $value}}
{{- end }}



# {{ "<----------------------------------------------------------->" }}
  
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
